<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="view-transition" content="same-origin">

	<title>Profile</title>
	<link rel="stylesheet" href="style.css">
	<link rel="manifest" href="manifest.json">
	<script>
		window.addEventListener('pagereveal', (e) => {
  console.log('pagereveal fired', e.viewTransition);
  if (e.viewTransition) {
    e.viewTransition.ready.catch(err => console.log('ready rejected:', err));
  }
});
	</script>
	<script src="Furzona.js"></script>
	<script src="nav.js" defer></script>
	<script src="profile.js" defer></script>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

	<script>
		(function () {
			const params = new URLSearchParams(window.location.search);
			for (const key of ["avatar", "banner"]) {
				const url = params.get(key);
				if (!url) continue;
				const link = document.createElement("link");
				link.rel = "preload";
				link.as = "image";
				link.href = url;
				document.head.appendChild(link);
			}
		})();
	</script>
</head>
<body>
	<header>
		<h1>Profile</h1>
		<section>
			<button type="button" id="back-to-home">Back</button>
			<button type="button" data-nav-search>Search</button>
			<button type="button">Menu</button>
		</section>
	</header>
	<main>
		<section class="profile-card" id="profile-card">
			<img id="profile-banner" class="banner" alt="Profile banner">
			<div class="profile-top">
				<img id="profile-avatar" class="avatar" alt="Profile avatar">
				<div>
					<h1 id="profile-name" class="name">Loading...</h1>
					<p id="profile-meta" class="meta"></p>
				</div>
			</div>
			<p id="profile-bio" class="bio"></p>
			<div id="profile-stats" class="stats"></div>
		</section>
	</main>
</body>
</html>
