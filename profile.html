<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="view-transition" content="same-origin">
	<style>@view-transition { navigation: auto; }</style>

	<meta name="description" content="View a Furzona Lite profile.">
	<meta property="og:site_name" content="Furzona Lite">
	<meta property="og:title" content="Profile — Furzona Lite">
	<meta property="og:description" content="View a Furzona Lite profile.">
	<meta property="og:type" content="profile">
	<meta property="og:url" content="https://iemand005.github.io/FurzonaWeb/profile.html">
	<meta property="og:image" content="https://iemand005.github.io/FurzonaWeb/Logo.png">
	<meta name="twitter:card" content="summary_large_image">

	<title>Profile</title>
	<link rel="stylesheet" href="style.css">
	<link rel="manifest" href="manifest.json">
	<script src="Furzona.js"></script>
	<script src="profile-preload.js"></script>
	<script src="nav.js" defer></script>
	<script src="profile.js" defer></script>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
</head>
<body>
	<header>
		<section>
			<img src="Logo.png" alt="Furzona logo" srcset="" data-nav-home>
			<h1>Profile</h1>
		</section>
		<section>
			<button type="button" class="btn" data-nav-back><img src="Assets/arrow-left.svg" alt="Back"></button>
			<button type="button" class="btn" data-nav-forward><img src="Assets/arrow-right.svg" alt="Next"></button>
			<button type="button" class="btn" data-nav-search><img src="Assets/search.svg" alt="Search"></button>
			<button type="button" class="btn"><img src="Assets/menu.svg" alt="Menu"></button>
		</section>
	</header>
	<main>
		<section class="profile-card card" id="profile-card">
			<img id="profile-banner" class="banner" alt="Profile banner">
			<div class="profile-top">
				<img id="profile-avatar" class="avatar" alt="Profile avatar">
				<div>
					<h1 id="profile-name" class="name">Loading...</h1>
					<p id="profile-meta" class="meta"></p>
				</div>
			</div>
			<p id="profile-bio" class="bio"></p>
			<div id="profile-stats" class="stats"></div>
		</section>
	</main>
</body>
</html>
