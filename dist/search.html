<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="view-transition" content="same-origin">
	<style>@view-transition { navigation: auto; }</style>

	<meta name="description" content="Search Furzona Lite.">
	<meta property="og:site_name" content="Furzona Lite">
	<meta property="og:title" content="Search — Furzona Lite">
	<meta property="og:description" content="Search Furzona Lite.">
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://iemand005.github.io/FurzonaWeb/search.html">
	<meta property="og:image" content="https://iemand005.github.io/FurzonaWeb/Logo.png">
	<meta name="twitter:card" content="summary_large_image">

	<title>Furzona Lite Search</title>
	<link rel="stylesheet" href="style.css">
	<link rel="manifest" href="manifest.json">

	<script nomodule src="polyfill.js"></script>
	<script nomodule src="fetch-polyfill.js"></script>
	<script nomodule src="url-polyfill.js"></script>

	<script src="Furzona.js"></script>
	<script src="nav.js" defer></script>
	<script src="like.js" defer></script>
	<script src="search.js" defer></script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
</head>
<body>
	<header>
		<section>
			<img src="Logo.png" alt="Furzona logo" srcset="" id="nav-home">
			<h1>Search</h1>
		</section>
		<section>
			<button type="button" id="nav-search"><img src="Assets/search.svg" alt="Search"></button>
		</section>
	</header>
	<main>
		<form id="search-form" class="search-form">
			<input class="input" type="search" id="search-input" placeholder="Search posts and users…" autocomplete="off">
			<button type="submit">Search</button>
		</form>
		<p id="search-empty" class="meta"></p>
		<ul id="search-results"></ul>
	</main>
</body>
</html>
