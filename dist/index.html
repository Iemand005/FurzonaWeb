<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="view-transition" content="same-origin">
	<style>@view-transition { navigation: auto; }</style>

	<meta name="description" content="Furzona Lite — a lightweight frontend for browsing Furzona posts and profiles.">
	<meta property="og:site_name" content="Furzona Lite">
	<meta property="og:title" content="Furzona Lite — Home">
	<meta property="og:description" content="Furzona Lite — a lightweight frontend for browsing Furzona posts and profiles.">
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://iemand005.github.io/FurzonaWeb/">
	<meta property="og:image" content="https://iemand005.github.io/FurzonaWeb/Logo.png">
	<meta name="twitter:card" content="summary_large_image">

	<title>Furzona Lite - Home</title>
	<link rel="stylesheet" href="style.css">
	<link rel="manifest" href="manifest.json">

	<script nomodule src="polyfill.js"></script>
	<script nomodule src="fetch-polyfill.js"></script>
	<script nomodule src="url-polyfill.js"></script>


	<script src="Furzona.js" defer></script>
	<script src="vt-types.js"></script>
	<script src="nav.js" defer></script>
	<script src="index.js" defer></script>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
</head>
<body>
	<header>
		<section>
			<img src="Logo.png" alt="Furzona logo" srcset="" data-nav-home>
			<h1>Home</h1>
		</section>
		<section>
			<button type="button" data-nav-back><img src="Assets/arrow-left.svg" alt="Back"></button>
			<button type="button" data-nav-forward><img src="Assets/arrow-right.svg" alt="Next"></button>
			<button type="button" data-nav-search><img src="Assets/search.svg" alt="Search"></button>
			<button type="button"><img src="Assets/menu.svg" alt="Menu"></button>
		</section>
	</header>
	<main>

		<div id="error-container"></div>
		
		<ul id="posts-list">
			
		</ul>
	</main>
</body>
</html>
