<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="view-transition" content="same-origin">
	<style>@view-transition { navigation: auto; }</style>

	<meta name="description" content="Create a new Furzona Lite post.">
	<meta property="og:site_name" content="Furzona Lite">
	<meta property="og:title" content="New Post — Furzona Lite">
	<meta property="og:description" content="Create a new Furzona Lite post.">
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://iemand005.github.io/FurzonaWeb/create-post.html">
	<meta property="og:image" content="https://iemand005.github.io/FurzonaWeb/Logo.png">
	<meta name="twitter:card" content="summary_large_image">

	<title>New Post</title>
	<link rel="stylesheet" href="style.css">
	<link rel="manifest" href="manifest.json">

	<script nomodule src="polyfill.js"></script>
	<script nomodule src="fetch-polyfill.js"></script>
	<script nomodule src="url-polyfill.js"></script>

	<script src="Furzona.js" defer></script>
	<script src="nav.js" defer></script>
	<script src="create-post.js" defer></script>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
</head>
<body>
	<header>
		<section>
			<img src="Logo.png" alt="Furzona logo" srcset="" data-nav-home>
			<h1>New Post</h1>
		</section>
		<section>
			<button type="button" data-nav-back><img src="Assets/arrow-left.svg" alt="Back"></button>
			<button type="button" data-nav-forward><img src="Assets/arrow-right.svg" alt="Next"></button>
			<button type="button" data-nav-search><img src="Assets/search.svg" alt="Search"></button>
			<button type="button"><img src="Assets/menu.svg" alt="Menu"></button>
		</section>
	</header>
	<main>
		<section class="card login-card">
			<h1>Create a post</h1>
			<form id="new-post-form">
				<label class="field" for="post-type">Type</label>
<select class="input" id="post-type">
					<option value="0">Text</option>
					<option value="1">Image / media</option>
				</select>

				<label class="field" for="post-title">Title</label>
				<input class="input" type="text" id="post-title" placeholder="Title…" maxlength="200">

				<label class="field" for="post-description">Description</label>
				<textarea class="input" id="post-description" rows="6" placeholder="What's this about?"></textarea>

				<label class="field" for="post-media">Media (optional)</label>
				<input class="input" type="file" id="post-media" accept="image/*" multiple>

				<p id="post-status" class="meta"></p>
				<button type="submit">Post</button>
			</form>
		</section>
	</main>
</body>
</html>
