<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="view-transition" content="same-origin">
	<style>@view-transition { navigation: auto; }</style>

	<meta name="description" content="Browse Furzona Lite posts.">
	<meta property="og:site_name" content="Furzona Lite">
	<meta property="og:title" content="Posts — Furzona Lite">
	<meta property="og:description" content="Browse Furzona Lite posts.">
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://iemand005.github.io/FurzonaWeb/posts.html">
	<meta property="og:image" content="https://iemand005.github.io/FurzonaWeb/Logo.png">
	<meta name="twitter:card" content="summary_large_image">

	<title>Posts</title>
	<link rel="stylesheet" href="style.css">
	<link rel="manifest" href="manifest.json">

	<script nomodule src="polyfill.js"></script>
	<script nomodule src="fetch-polyfill.js"></script>
	<script nomodule src="url-polyfill.js"></script>

	<script src="Furzona.js" defer></script>
	<script src="preload.js"></script>
	<script src="nav.js" defer></script>
	<script src="like.js" defer></script>
	<script src="posts.js" defer></script>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
</head>
<body>
	<header>
		<section>
			<img src="Logo.png" alt="Furzona logo" srcset="" data-nav-home>
			<h1 id="page-title">Posts</h1>
		</section>
		<section>
			<button type="button" data-nav-back><img src="Assets/arrow-left.svg" alt="Back"></button>
			<button type="button" data-nav-forward><img src="Assets/arrow-right.svg" alt="Next"></button>
			<button type="button" data-nav-search><img src="Assets/search.svg" alt="Search"></button>
			<button type="button"><img src="Assets/menu.svg" alt="Menu"></button>
		</section>
	</header>
	<main>
		<section class="profile-card card" id="posts-header" hidden>
			<img class="pfp" id="posts-owner-avatar" alt="Owner avatar" data-transition="avatar">
			<p id="posts-owner-name" class="name" data-transition="name"></p>
		</section>

		<div id="error-container"></div>

		<ul id="posts-list">

		</ul>
	</main>
</body>
</html>
